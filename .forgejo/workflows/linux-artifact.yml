name: Linux artifact

on:
  push:
    branches: [main, "runner-test/**"]
    tags: ["v*", "promote-v*"]
  pull_request:

jobs:
  linux-artifact:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/promote-v')
    runs-on: nixos
    steps:
      - name: Verify pinned Node runtime and prepare portable runtime
        env:
          NODE_VERSION: 22.23.2
          GITHUB_TOKEN: ""
        run: |
          set -eu
          for command_name in curl git g++ make node npm sha256sum gzip tar awk; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing host command: %s\n' "$command_name" >&2; exit 1; }
          done
          node_root="${RUNNER_TEMP:-/tmp}/nookbridge-node-v${NODE_VERSION}"
          archive_name="node-v${NODE_VERSION}-linux-x64.tar.gz"
          archive_path="${RUNNER_TEMP:-/tmp}/$archive_name"
          sums_path="${RUNNER_TEMP:-/tmp}/SHASUMS256.txt"
          if [ ! -x "$node_root/bin/node" ] || [ ! -f "$archive_path" ]; then
            rm -rf "$node_root"
            mkdir -p "$node_root"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/$archive_name" -o "$archive_path"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o "$sums_path"
            expected_sha256="$(awk -v name="$archive_name" '$2 == name { print $1 }' "$sums_path")"
            actual_sha256="$(sha256sum "$archive_path" | awk '{ print $1 }')"
            test -n "$expected_sha256"
            test "$actual_sha256" = "$expected_sha256"
            tar -xzf "$archive_path" -C "$node_root" --strip-components=1
          fi
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "10.9.8"

      - name: Checkout
        run: |
          set -eu
          for command_name in git curl g++ make sha256sum gzip tar; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          checkout_ref="${GITHUB_REF:-$GITHUB_SHA}"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            git -c http.extraheader="Authorization: Bearer ${GITHUB_TOKEN}" \
              fetch --no-tags --depth=1 origin "$checkout_ref"
          else
            git fetch --no-tags --depth=1 origin "$checkout_ref"
          fi
          git checkout -q --detach FETCH_HEAD

      - name: Verify npm registry access
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          node --version
          npm --version
          npm config get registry
          npm ping \
            --registry=https://registry.npmjs.org/ \
            --fetch-timeout=10000 \
            --fetch-retries=0

      - name: Install packages without lifecycle scripts
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          npm ci \
            --cache /tmp/nookbridge-npm-cache \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            --verbose \
            --timing

      - name: Rebuild native and lifecycle dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          npm rebuild \
            --cache /tmp/nookbridge-npm-cache \
            --no-audit \
            --no-fund \
            --foreground-scripts \
            --verbose \
            --timing

      - name: Report npm diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          for log_path in /tmp/nookbridge-npm-cache/_logs/*; do
            [ -f "$log_path" ] || continue
            printf '\n=== npm log: %s ===\n' "$log_path"
            LOG_PATH="$log_path" node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(process.env.LOG_PATH, "utf8").split(/\r?\n/);
              process.stdout.write(lines.slice(-200).join("\n"));
            '
          done

      - name: Build and test
        env:
          GITHUB_TOKEN: ""
        run: |
          npm run build
          npm test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Prepare production dependencies
        env:
          GITHUB_TOKEN: ""
        run: npm prune --omit=dev

      - name: Require successful main runner preflight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PREFLIGHT_READ_TOKEN: ${{ secrets.RELEASE_PREFLIGHT_TOKEN }}
        run: |
          set -eu
          test -n "${PREFLIGHT_READ_TOKEN:-}"
          PREFLIGHT_RUNS_URL="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs" \
            node scripts/check-forgejo-preflight.mjs

      - name: Build and verify x86_64 glibc artifact
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/runner-test/') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              ;;
            refs/heads/main|refs/heads/runner-test/*)
              VERSION="ci-${GITHUB_SHA:0:12}"
              ;;
            *)
              printf 'unexpected artifact-build ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          RUNTIME_TARBALL="${RUNNER_TEMP:-/tmp}/node-v22.23.2-linux-x64.tar.gz"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          GLIBC_BASELINE="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          LIBSTDCXX_BASELINE="$(strings "$(g++ -print-file-name=libstdc++.so.6)" | grep -E '^GLIBCXX_[0-9]+(\.[0-9]+){1,2}$' | sort -V | tail -n 1)"
          test -n "$LIBSTDCXX_BASELINE"
          # The operator socket spawns this helper to read SO_PEERCRED.  Static
          # linking keeps it off the artifact's glibc/libstdcxx baseline floor.
          for command_name in cc find readelf; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          # The runner must provide the static glibc output explicitly.  A
          # dynamically linked fallback embeds /nix/store in the portable
          # artifact and is rejected by the artifact verifier.  Nix store
          # basenames include the store hash before the package name.
          STATIC_GLIBC="$(find /nix/store -mindepth 1 -maxdepth 1 -type d -name '*-glibc-*-static' -print | LC_ALL=C sort | tail -n 1)"
          if [ -z "$STATIC_GLIBC" ]; then
            printf 'static glibc output not found in /nix/store\n' >&2
            find /nix/store -mindepth 1 -maxdepth 1 -type d -name '*glibc*static*' -print | LC_ALL=C sort >&2 || true
            exit 1
          fi
          printf 'using static glibc: %s\n' "$STATIC_GLIBC"
          test -f "$STATIC_GLIBC/lib/libc.a" \
            || { printf 'static glibc is missing libc.a: %s\n' "$STATIC_GLIBC" >&2; exit 1; }
          HELPER="${RUNNER_TEMP:-/tmp}/nookbridge-operator-peercred-helper"
          cc -O2 -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector \
            -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-pie -no-pie \
            -nostdlib -static -Wl,-e,_start -Wl,--build-id=none \
            -L"$STATIC_GLIBC/lib" -o "$HELPER" native/operator-peercred.c
          if readelf -l "$HELPER" | grep -E 'INTERP' >/dev/null; then
            printf 'peer-credential helper is dynamically linked\n' >&2
            exit 1
          fi
          if strings "$HELPER" | grep -E '/nix/store/[[:alnum:]]|(^|[[:space:]])/build/|/tmp/nookbridge/' >/dev/null; then
            printf 'peer-credential helper contains a host path\n' >&2
            exit 1
          fi
          chmod 0755 "$HELPER"
          npm run artifact:linux -- \
            --source-dir "$PWD" \
            --build-node "$(command -v node)" \
            --runtime-tarball "$RUNTIME_TARBALL" \
            --operator-peercred-helper "$HELPER" \
            --output-dir "$PWD/artifacts" \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --min-glibc "$GLIBC_BASELINE" \
            --min-libstdcxx "$LIBSTDCXX_BASELINE"
          npm run artifact:verify -- \
            --artifact "$PWD/artifacts/nookbridge-v${VERSION}-linux-x64-gnu.tar.gz" \
            --checksum-file "$PWD/artifacts/SHA256SUMS" \
            --expect-git-commit "$GITHUB_SHA"

      - name: Prepare GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ""
        run: |
          set -eu
          VERSION="${RELEASE_TAG#v}"
          RELEASE_DIR="$PWD/github-release"
          ARTIFACT="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          mkdir -p "$RELEASE_DIR"

          installer_version="$(sed -n "s/^readonly RELEASE_VERSION='\([^']*\)'$/\1/p" scripts/install-from-github.sh)"
          test "$installer_version" = "$VERSION"
          cp "artifacts/$ARTIFACT" "$RELEASE_DIR/$ARTIFACT"
          cp scripts/install-from-github.sh "$RELEASE_DIR/install.sh"
          cp scripts/install-systemd.sh "$RELEASE_DIR/install-systemd.sh"
          cp scripts/verify-linux-artifact.sh "$RELEASE_DIR/verify-linux-artifact.sh"
          chmod 0755 "$RELEASE_DIR/install.sh" "$RELEASE_DIR/install-systemd.sh" "$RELEASE_DIR/verify-linux-artifact.sh"
          (
            cd "$RELEASE_DIR"
            sha256sum install-systemd.sh verify-linux-artifact.sh "$ARTIFACT" > SHA256SUMS
          )

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ""
        run: |
          set -eu
          test -n "$RELEASE_PUBLISH_TOKEN"
          API="https://api.github.com/repos/monty033/NookBridge"
          AUTH_HEADER="Authorization: Bearer ${RELEASE_PUBLISH_TOKEN}"
          RELEASE_DIR="$PWD/github-release"
          RELEASE_JSON=/tmp/nookbridge-github-release.json

          http_status="$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$RELEASE_TAG")"
          case "$http_status" in
            200)
              RELEASE_JSON="$RELEASE_JSON" RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" node <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          const expectedTag = process.env.RELEASE_TAG;
          const expectedSha = process.env.RELEASE_SHA.toLowerCase();
          if (
            release.tag_name !== expectedTag ||
            release.prerelease !== true ||
            String(release.target_commitish || '').toLowerCase() !== expectedSha
          ) {
            throw new Error('existing GitHub release is not the matching prerelease candidate');
          }
          NODE
              ;;
            404)
              RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const sha = process.env.RELEASE_SHA;
          fs.writeFileSync('/tmp/nookbridge-release-payload.json', JSON.stringify({
            tag_name: tag,
            target_commitish: sha,
            name: tag,
            body: `NookBridge ${tag}\n\nCandidate release. Verified by the Linux artifact job and awaiting clean-LXC rendered acceptance before promotion.\n\nInstall once promoted:\n\n    curl -fsSL https://github.com/monty033/NookBridge/releases/latest/download/install.sh | sudo bash\n\nBuild source: Forgejo canonical commit ${sha}.`,
            draft: false,
            // Candidate gate: a tag push must never publish to the general
            // install path.  Promotion to a normal release is a separate,
            // explicit step (push a promote-<tag> ref) that re-verifies the
            // artifact before flipping this flag.
            prerelease: true,
            generate_release_notes: false
          }, null, 2));
          NODE
              curl -fsS -X POST -o "$RELEASE_JSON" \
                -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/nookbridge-release-payload.json \
                "$API/releases"
              ;;
            *)
              cat "$RELEASE_JSON"
              exit 1
              ;;
          esac

          release_id="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('$RELEASE_JSON')); if (!value.id) process.exit(2); process.stdout.write(String(value.id));")"
          assets_json=/tmp/nookbridge-github-assets.json
          curl -fsS -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            "$API/releases/$release_id/assets?per_page=100" -o "$assets_json"
          upload_base="https://uploads.github.com/repos/monty033/NookBridge/releases/$release_id/assets"

          for asset_path in \
            "$RELEASE_DIR/install.sh" \
            "$RELEASE_DIR/install-systemd.sh" \
            "$RELEASE_DIR/verify-linux-artifact.sh" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/nookbridge-v${RELEASE_TAG#v}-linux-x64-gnu.tar.gz"; do
            asset_name="${asset_path##*/}"
            asset_id="$(ASSET_NAME="$asset_name" node -e "const fs=require('fs'); const name=process.env.ASSET_NAME; const assets=JSON.parse(fs.readFileSync('$assets_json')); const match=assets.find((asset) => asset.name === name); if (match) process.stdout.write(String(match.id));")"
            if [ -n "$asset_id" ]; then
              curl -fsS -X DELETE -H "$AUTH_HEADER" "$API/releases/assets/$asset_id" >/dev/null
            fi
            curl -fsS -X POST \
              -H "$AUTH_HEADER" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset_path" \
              "$upload_base?name=$asset_name" >/dev/null
          done

          curl -fsS -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            "$API/releases/$release_id/assets?per_page=100" -o "$assets_json"
          RELEASE_ASSETS_JSON="$assets_json" node <<'NODE'
          const fs = require('fs');
          const required = new Set([
            'install.sh',
            'install-systemd.sh',
            'verify-linux-artifact.sh',
            'SHA256SUMS',
            `nookbridge-v${process.env.RELEASE_TAG.slice(1)}-linux-x64-gnu.tar.gz`
          ]);
          const actual = new Set(JSON.parse(fs.readFileSync(process.env.RELEASE_ASSETS_JSON)).map((asset) => asset.name));
          for (const name of required) {
            if (!actual.has(name)) throw new Error(`missing GitHub release asset: ${name}`);
          }
          NODE
          printf 'GitHub release published: %s\n' "$RELEASE_TAG"

  promote-release:
    # Candidate promotion.  A `v*` tag push only ever produces a prerelease;
    # this is the explicit step that moves a candidate onto the general install
    # path.  It re-verifies the published artifact against the release's own
    # target commit before flipping the flag, so promotion cannot bless a
    # candidate that does not match the commit it claims.
    if: startsWith(github.ref, 'refs/tags/promote-v')
    runs-on: nixos
    steps:
      - name: Checkout promotion tooling
        run: |
          set -eu
          for command_name in git curl; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF:-$GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Re-verify the candidate artifact and promote it
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          PROMOTE_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ""
        run: |
          set -eu
          test -n "$RELEASE_PUBLISH_TOKEN"
          API="https://api.github.com/repos/monty033/NookBridge"
          AUTH_HEADER="Authorization: Bearer ${RELEASE_PUBLISH_TOKEN}"
          REL_TAG="${PROMOTE_REF#promote-}"
          VERSION="${REL_TAG#v}"
          ARTIFACT="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          RELEASE_JSON=/tmp/nookbridge-promote.json

          curl -fsS -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$REL_TAG" -o "$RELEASE_JSON"
          release_id="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('$RELEASE_JSON')); if (!value.id) process.exit(2); process.stdout.write(String(value.id));")"
          prerelease="$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync('$RELEASE_JSON')).prerelease));")"
          target_commit="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('$RELEASE_JSON')).target_commitish; if (!/^[0-9a-f]{40,64}$/.test(value || '')) process.exit(2); process.stdout.write(value);")"

          # Only a candidate may be promoted, and only once.
          test "$prerelease" = "true"

          work_dir="$(mktemp -d)"
          for asset_name in "$ARTIFACT" SHA256SUMS; do
            curl -fsSL \
              "https://github.com/monty033/NookBridge/releases/download/$REL_TAG/$asset_name" \
              -o "$work_dir/$asset_name"
          done

          # Provenance gate: the artifact must record the release's own target
          # commit before it is allowed onto the general install path.
          bash scripts/verify-linux-artifact.sh \
            --artifact "$work_dir/$ARTIFACT" \
            --checksum-file "$work_dir/SHA256SUMS" \
            --expect-git-commit "$target_commit"

          curl -fsS -X PATCH -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary '{"prerelease":false}' \
            "$API/releases/$release_id" -o "$RELEASE_JSON"

          # Read back the promoted state; a successful PATCH is not proof.
          curl -fsS -H "$AUTH_HEADER" -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$REL_TAG" -o "$RELEASE_JSON"
          promoted="$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync('$RELEASE_JSON')).prerelease));")"
          test "$promoted" = "false"
          printf 'release promoted: %s\n' "$REL_TAG"
