name: Linux artifact

on:
  push:
    branches: [main, "runner-test/**"]
    tags: ["v*", "promote-v*"]
  pull_request:

jobs:
  linux-artifact:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/promote-v')
    runs-on: nixos
    steps:
      - name: Verify pinned Node runtime and prepare portable runtime
        env:
          NODE_VERSION: 22.23.2
          GITHUB_TOKEN: ""
        run: |
          set -eu
          for command_name in curl git g++ make node npm sha256sum gzip tar awk; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing host command: %s\n' "$command_name" >&2; exit 1; }
          done
          node_root="${RUNNER_TEMP:-/tmp}/nookbridge-node-v${NODE_VERSION}"
          archive_name="node-v${NODE_VERSION}-linux-x64.tar.gz"
          archive_path="${RUNNER_TEMP:-/tmp}/$archive_name"
          sums_path="${RUNNER_TEMP:-/tmp}/SHASUMS256.txt"
          # The archive is verified on every run, not only when it is downloaded. A
          # persistent runner, or a preceding job that can write to the temporary
          # directory, could otherwise substitute the runtime that gets packaged.
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o "$sums_path"
          expected_sha256="$(awk -v name="$archive_name" '$2 == name { print $1 }' "$sums_path")"
          test -n "$expected_sha256"
          cached_sha256="$(sha256sum "$archive_path" 2>/dev/null | awk '{ print $1 }')"
          if [ ! -f "$archive_path" ] || [ "$cached_sha256" != "$expected_sha256" ]; then
            rm -f "$archive_path"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/$archive_name" -o "$archive_path"
            test "$(sha256sum "$archive_path" | awk '{ print $1 }')" = "$expected_sha256"
          fi
          # The extraction is rebuilt from the verified archive on every run. A
          # cached runtime is not trusted just because it reports the pinned
          # version: a preceding source-controlled step could have replaced it with
          # a trojan that prints any version, and this directory goes on PATH.
          rm -rf "$node_root"
          mkdir -p "$node_root"
          tar -xzf "$archive_path" -C "$node_root" --strip-components=1
          # Later steps must use the verified runtime rather than whatever the runner
          # provides, so the pinned directory goes on PATH for every following step.
          echo "$node_root/bin" >> "$GITHUB_PATH"
          export PATH="$node_root/bin:$PATH"
          test "$(command -v node)" = "$node_root/bin/node"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "10.9.8"

      - name: Checkout
        run: |
          set -eu
          for command_name in git curl g++ make sha256sum gzip tar; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          checkout_ref="${GITHUB_REF:-$GITHUB_SHA}"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            git -c http.extraheader="Authorization: Bearer ${GITHUB_TOKEN}" \
              fetch --no-tags --depth=1 origin "$checkout_ref"
          else
            git fetch --no-tags --depth=1 origin "$checkout_ref"
          fi
          git checkout -q --detach FETCH_HEAD

      - name: Verify npm registry access
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          node --version
          npm --version
          npm config get registry
          npm ping \
            --registry=https://registry.npmjs.org/ \
            --fetch-timeout=10000 \
            --fetch-retries=0

      - name: Install packages without lifecycle scripts
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          npm ci \
            --cache /tmp/nookbridge-npm-cache \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            --verbose \
            --timing

      - name: Rebuild native and lifecycle dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          npm rebuild \
            --cache /tmp/nookbridge-npm-cache \
            --no-audit \
            --no-fund \
            --foreground-scripts \
            --verbose \
            --timing

      - name: Report npm diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          for log_path in /tmp/nookbridge-npm-cache/_logs/*; do
            [ -f "$log_path" ] || continue
            printf '\n=== npm log: %s ===\n' "$log_path"
            LOG_PATH="$log_path" node -e '
              const fs = require("node:fs");
              const lines = fs.readFileSync(process.env.LOG_PATH, "utf8").split(/\r?\n/);
              process.stdout.write(lines.slice(-200).join("\n"));
            '
          done

      - name: Build and test
        env:
          GITHUB_TOKEN: ""
        run: |
          npm run build
          npm test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Prepare production dependencies
        env:
          GITHUB_TOKEN: ""
        run: npm prune --omit=dev

      - name: Require successful main runner preflight
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          # This step deliberately holds no token. The runs API is readable
          # anonymously on a public repository, so a read token bought no
          # capability while handing a secret to the tagged revision's own script.
          # A secret must never be reachable by code from the ref being released.
          PREFLIGHT_RUNS_URL="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs" \
            node scripts/check-forgejo-preflight.mjs

      - name: Build and verify x86_64 glibc artifact
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/runner-test/') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              ;;
            refs/heads/main|refs/heads/runner-test/*)
              VERSION="ci-${GITHUB_SHA:0:12}"
              ;;
            *)
              printf 'unexpected artifact-build ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          RUNTIME_TARBALL="${RUNNER_TEMP:-/tmp}/node-v22.23.2-linux-x64.tar.gz"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          GLIBC_BASELINE="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          LIBSTDCXX_BASELINE="$(strings "$(g++ -print-file-name=libstdc++.so.6)" | grep -E '^GLIBCXX_[0-9]+(\.[0-9]+){1,2}$' | sort -V | tail -n 1)"
          test -n "$LIBSTDCXX_BASELINE"
          # The operator socket spawns this helper to read SO_PEERCRED.  Static
          # linking keeps it off the artifact's glibc/libstdcxx baseline floor.
          for command_name in cc find readelf; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          # The runner must provide the static glibc output explicitly.  A
          # dynamically linked fallback embeds /nix/store in the portable
          # artifact and is rejected by the artifact verifier.  Nix store
          # basenames include the store hash before the package name.
          STATIC_GLIBC="$(find /nix/store -mindepth 1 -maxdepth 1 -type d -name '*-glibc-*-static' -print | LC_ALL=C sort | tail -n 1)"
          if [ -z "$STATIC_GLIBC" ]; then
            printf 'static glibc output not found in /nix/store\n' >&2
            find /nix/store -mindepth 1 -maxdepth 1 -type d -name '*glibc*static*' -print | LC_ALL=C sort >&2 || true
            exit 1
          fi
          printf 'using static glibc: %s\n' "$STATIC_GLIBC"
          test -f "$STATIC_GLIBC/lib/libc.a" \
            || { printf 'static glibc is missing libc.a: %s\n' "$STATIC_GLIBC" >&2; exit 1; }
          HELPER="${RUNNER_TEMP:-/tmp}/nookbridge-operator-peercred-helper"
          cc -O2 -std=c11 -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector \
            -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-pie -no-pie \
            -nostdlib -static -Wl,-e,_start -Wl,--build-id=none \
            -L"$STATIC_GLIBC/lib" -o "$HELPER" native/operator-peercred.c
          if readelf -l "$HELPER" | grep -E 'INTERP' >/dev/null; then
            printf 'peer-credential helper is dynamically linked\n' >&2
            exit 1
          fi
          if strings "$HELPER" | grep -E '/nix/store/[[:alnum:]]|(^|[[:space:]])/build/|/tmp/nookbridge/' >/dev/null; then
            printf 'peer-credential helper contains a host path\n' >&2
            exit 1
          fi
          chmod 0755 "$HELPER"
          npm run artifact:linux -- \
            --source-dir "$PWD" \
            --build-node "$(command -v node)" \
            --runtime-tarball "$RUNTIME_TARBALL" \
            --operator-peercred-helper "$HELPER" \
            --output-dir "$PWD/artifacts" \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --min-glibc "$GLIBC_BASELINE" \
            --min-libstdcxx "$LIBSTDCXX_BASELINE"
          npm run artifact:verify -- \
            --artifact "$PWD/artifacts/nookbridge-v${VERSION}-linux-x64-gnu.tar.gz" \
            --checksum-file "$PWD/artifacts/SHA256SUMS" \
            --expect-git-commit "$GITHUB_SHA" \
            --expect-version "$VERSION"

      - name: Prepare GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ""
        run: |
          set -eu
          VERSION="${RELEASE_TAG#v}"
          # A tag pushed by hand reaches this step without passing through the
          # operator command, so the release policy is enforced here too, from the
          # same script the operator command uses.
          bash scripts/check-release-version.sh "$VERSION" \
            || { printf 'malformed release version: %s\n' "$VERSION" >&2; exit 1; }
          RELEASE_DIR="$PWD/github-release"
          ARTIFACT="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          mkdir -p "$RELEASE_DIR"

          installer_version="$(sed -n "s/^readonly RELEASE_VERSION='\([^']*\)'$/\1/p" scripts/install-from-github.sh)"
          test "$installer_version" = "$VERSION"
          # A tag pushed by hand skips the operator command's version-surface
          # check, so the same check runs here: a tag whose commit disagrees with
          # the version in its own manifest must not publish an artifact that
          # carries one version while the release is named another.
          package_version="$(node -e "process.stdout.write(String(require('./package.json').version))")"
          lock_version="$(node -e "process.stdout.write(String(require('./package-lock.json').version))")"
          test "$package_version" = "$VERSION"
          test "$lock_version" = "$VERSION"
          cp "artifacts/$ARTIFACT" "$RELEASE_DIR/$ARTIFACT"
          cp scripts/install-from-github.sh "$RELEASE_DIR/install.sh"
          cp scripts/install-systemd.sh "$RELEASE_DIR/install-systemd.sh"
          cp scripts/verify-linux-artifact.sh "$RELEASE_DIR/verify-linux-artifact.sh"
          chmod 0755 "$RELEASE_DIR/install.sh" "$RELEASE_DIR/install-systemd.sh" "$RELEASE_DIR/verify-linux-artifact.sh"
          (
            cd "$RELEASE_DIR"
            sha256sum install-systemd.sh verify-linux-artifact.sh "$ARTIFACT" > SHA256SUMS
          )

      - name: Prepare the GitHub release upload
        # Token-free: the mirror repository is public, so its release metadata is
        # readable anonymously. This step decides what the write step must do and
        # writes that decision as data. The write step holds the token and runs no
        # repository code, so a tagged script cannot reach the credential through
        # PATH, GITHUB_ENV, or a file it asks the write step to source.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ""
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION="${RELEASE_TAG#v}"
          bash scripts/check-release-version.sh "$VERSION" \
            || { printf 'malformed release tag: %s\n' "$RELEASE_TAG" >&2; exit 1; }
          API="https://api.github.com/repos/monty033/NookBridge"
          RELEASE_DIR="$PWD/github-release"
          ARTIFACT="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          RELEASE_JSON="$PWD/.release-state.json"
          PAYLOAD="$PWD/.release-payload.json"
          DECISION="$PWD/.release-existing-id"
          context="$PWD/.release-upload.tsv"

          http_status="$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$RELEASE_TAG")"
          case "$http_status" in
            200)
              # An existing candidate must be exactly the one this tag produced: the
              # same commit, still a prerelease, not a draft, and already carrying the
              # complete asset set. Anything else is an inconsistent release, so this
              # run stops instead of mutating it.
              RELEASE_JSON="$RELEASE_JSON" RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" ARTIFACT="$ARTIFACT" DECISION="$DECISION" node <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          const expectedTag = process.env.RELEASE_TAG;
          const expectedSha = process.env.RELEASE_SHA.toLowerCase();
          if (
            // A payload that omits `draft` is not evidence that the release is
            // visible, so the field is required rather than treated as false.
            typeof release.draft !== 'boolean' ||
            release.draft === true ||
            release.tag_name !== expectedTag ||
            release.prerelease !== true ||
            String(release.target_commitish || '').toLowerCase() !== expectedSha
          ) {
            throw new Error('existing GitHub release is not the matching prerelease candidate');
          }
          if (!Number.isInteger(release.id) || release.id <= 0) {
            throw new Error('existing GitHub release does not report its id');
          }
          // The candidate is rebuilt rather than patched. A run that failed partway
          // through its uploads leaves a release holding some of the assets, and a
          // tag is immutable, so refusing to touch it would make that failure
          // unrecoverable. Recreating from this run's own build is idempotent: the
          // re-verification step asserts the exact asset set afterwards.
          fs.writeFileSync(process.env.DECISION, String(release.id));
          NODE
              printf 'action\trecreate\n' > "$context"
              ;;
            404)
              printf 'action\tcreate\n' > "$context"
              ;;
            *)
              cat "$RELEASE_JSON"
              exit 1
              ;;
          esac

          # The release is written from this payload whether it is being created or
          # recreated, so the two paths cannot drift.
          RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" PAYLOAD="$PAYLOAD" node <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const sha = process.env.RELEASE_SHA;
          fs.writeFileSync(process.env.PAYLOAD, JSON.stringify({
            tag_name: tag,
            target_commitish: sha,
            name: tag,
            body: `NookBridge ${tag}\n\nCandidate release. Verified by the Linux artifact job and awaiting clean-LXC rendered acceptance before promotion.\n\nInstall once promoted:\n\n    curl -fsSL https://github.com/monty033/NookBridge/releases/latest/download/install.sh | sudo bash\n\nBuild source: Forgejo canonical commit ${sha}.`,
            draft: false,
            // Candidate gate: a tag push must never publish to the general
            // install path. Promotion to a normal release is a separate,
            // explicit step (push a promote-<tag> ref) that re-verifies the
            // artifact before flipping this flag.
            prerelease: true,
            generate_release_notes: false
          }, null, 2));
          NODE

          for asset_name in install.sh install-systemd.sh verify-linux-artifact.sh SHA256SUMS "$ARTIFACT"; do
            test -f "$RELEASE_DIR/$asset_name"
          done
          {
            printf 'api_base\thttps://api.github.com\n'
            printf 'rel_tag\t%s\n' "$RELEASE_TAG"
            printf 'release_dir\t%s\n' "$RELEASE_DIR"
            printf 'artifact\t%s\n' "$ARTIFACT"
            printf 'payload\t%s\n' "$PAYLOAD"
            printf 'decision\t%s\n' "$DECISION"
          } >> "$context"

      - name: Publish release assets
        # This step holds the publishing token. It resolves its tools from a fixed
        # PATH and reads the upload facts as data: it runs no repository script,
        # sources no file, and cannot be handed a substituted `curl` through a
        # GITHUB_PATH entry an earlier step wrote.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          # An explicit PATH replaces the runner's own, so directories an earlier
          # step added to GITHUB_PATH are not searched. The trusted prefixes cover
          # both a conventional Linux runner and a NixOS one.
          PATH: /run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # The runner injects anything a previous step wrote to $GITHUB_ENV into this
          # step, and a non-interactive bash sources BASH_ENV before it runs the body.
          # A tagged step could otherwise leave a script here and have this shell read
          # the token. The values are set explicitly so the injected ones cannot win,
          # and the body re-checks them so that a runner which applies them anyway
          # fails this step instead of running it with an attacker's startup file.
          BASH_ENV: ""
          ENV: ""
          GITHUB_TOKEN: ""
        run: |
          set -eu
          test -n "${RELEASE_PUBLISH_TOKEN:-}"
          test -z "${BASH_ENV:-}" \
            || { printf 'refusing a BASH_ENV in the token-bearing step\n' >&2; exit 1; }
          test -z "${ENV:-}" \
            || { printf 'refusing an ENV in the token-bearing step\n' >&2; exit 1; }
          curl_path="$(command -v curl)"
          case "$curl_path" in
            /run/current-system/sw/bin/* | /usr/local/* | /usr/bin/* | /bin/* | /sbin/*) ;;
            *)
              printf 'refusing an untrusted curl: %s\n' "$curl_path" >&2
              exit 1
              ;;
          esac
          awk_path="$(command -v awk)"
          case "$awk_path" in
            /run/current-system/sw/bin/* | /usr/bin/* | /bin/*) ;;
            *)
              printf 'refusing an untrusted awk: %s\n' "$awk_path" >&2
              exit 1
              ;;
          esac

          context="$PWD/.release-upload.tsv"
          field() { "$awk_path" -F'\t' -v key="$1" '$1 == key { print $2; exit }' "$context"; }
          api_base="$(field api_base)"
          rel_tag="$(field rel_tag)"
          release_dir="$(field release_dir)"
          artifact="$(field artifact)"
          payload="$(field payload)"
          action="$(field action)"
          decision="$(field decision)"
          test "$api_base" = "https://api.github.com"
          case "$rel_tag" in v[0-9]*) ;; *) printf 'unusable release tag\n' >&2; exit 1 ;; esac
          case "$action" in create | recreate) ;; *) printf 'unusable upload decision\n' >&2; exit 1 ;; esac
          case "$release_dir" in "$PWD"/*) ;; *) printf 'unusable release directory\n' >&2; exit 1 ;; esac

          # The bearer token is passed through a curl configuration file rather than
          # an argument, because a command line is readable by any process on the
          # runner and this token grants release write access.
          curl_config="$(mktemp)"
          chmod 600 "$curl_config"
          printf 'header = "Authorization: Bearer %s"\n' "$RELEASE_PUBLISH_TOKEN" > "$curl_config"
          trap 'rm -f "$curl_config"' EXIT

          if [ "$action" = recreate ]; then
            # An earlier run left a partial candidate. Deleting it first is what makes
            # a retry possible at all, since a tag cannot be moved to a new version.
            existing_id="$(cat "$decision" 2>/dev/null || true)"
            case "$existing_id" in '' | *[!0-9]*) printf 'unusable existing release id\n' >&2; exit 1 ;; esac
            "$curl_path" -fsS -X DELETE --config "$curl_config" \
              "$api_base/repos/monty033/NookBridge/releases/$existing_id" > /dev/null
          fi

          test -f "$payload"
          response="$PWD/.release-created.json"
          "$curl_path" -fsS -X POST -o "$response" \
            --config "$curl_config" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "$api_base/repos/monty033/NookBridge/releases"

          release_id="$(grep -o '"id" *: *[0-9][0-9]*' "$response" | head -1 | tr -dc '0-9')"
          case "$release_id" in '' | *[!0-9]*) printf 'could not read the release id\n' >&2; exit 1 ;; esac

          upload_base="https://uploads.github.com/repos/monty033/NookBridge/releases/$release_id/assets"
          for asset_name in install.sh install-systemd.sh verify-linux-artifact.sh SHA256SUMS "$artifact"; do
            # The asset name becomes a query-string value, so a name outside this set
            # could change the request: it is refused rather than encoded.
            case "$asset_name" in
              *[!A-Za-z0-9._-]*)
                printf 'unusable asset name\n' >&2
                exit 1
                ;;
            esac
            test -f "$release_dir/$asset_name"
            "$curl_path" -fsS -X POST \
              --config "$curl_config" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$release_dir/$asset_name" \
              "$upload_base?name=$asset_name" > /dev/null
          done
          printf 'release assets published: %s\n' "$rel_tag"

      - name: Re-verify the published release
        # Back to a step that holds no secret: it reads the public release back and
        # asserts the state the write step claims to have produced, because a
        # successful upload is not proof of the release users will see.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ""
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          VERSION="${RELEASE_TAG#v}"
          artifact="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          state="$PWD/.release-verified.json"
          curl -fsS -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/monty033/NookBridge/releases/tags/$RELEASE_TAG" -o "$state"
          RELEASE_STATE="$state" RELEASE_TAG="$RELEASE_TAG" RELEASE_SHA="$RELEASE_SHA" ARTIFACT="$artifact" node <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_STATE, 'utf8'));
          if (release.tag_name !== process.env.RELEASE_TAG) {
            throw new Error('published release carries the wrong tag');
          }
          if (release.prerelease !== true) {
            throw new Error('a tag push must publish a prerelease candidate');
          }
          if (typeof release.draft !== 'boolean') {
            throw new Error('published release payload does not report its draft state');
          }
          if (release.draft === true) {
            throw new Error('published release is a draft, so users cannot reach it');
          }
          if (String(release.target_commitish || '').toLowerCase() !== process.env.RELEASE_SHA.toLowerCase()) {
            throw new Error('published release targets a different commit');
          }
          const required = new Set([
            'install.sh',
            'install-systemd.sh',
            'verify-linux-artifact.sh',
            'SHA256SUMS',
            process.env.ARTIFACT
          ]);
          const actual = new Set((release.assets || []).map((asset) => String(asset.name)));
          for (const name of required) {
            if (!actual.has(name)) throw new Error('missing GitHub release asset: ' + name);
          }
          const extra = [...actual].filter((name) => !required.has(name));
          if (extra.length > 0) {
            throw new Error('unexpected GitHub release asset: ' + extra.join(', '));
          }
          NODE
          printf 'GitHub release published: %s\n' "$RELEASE_TAG"

  promote-release:
    # Candidate promotion.  A `v*` tag push only ever produces a prerelease;
    # this is the explicit step that moves a candidate onto the general install
    # path.  It re-verifies the published artifact against the release's own
    # target commit before flipping the flag, so promotion cannot bless a
    # candidate that does not match the commit it claims.
    if: startsWith(github.ref, 'refs/tags/promote-v')
    runs-on: nixos
    steps:
      - name: Verify pinned Node runtime and prepare portable runtime
        env:
          NODE_VERSION: 22.23.2
          GITHUB_TOKEN: ""
        run: |
          set -eu
          for command_name in curl git g++ make node npm sha256sum gzip tar awk; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing host command: %s\n' "$command_name" >&2; exit 1; }
          done
          node_root="${RUNNER_TEMP:-/tmp}/nookbridge-node-v${NODE_VERSION}"
          archive_name="node-v${NODE_VERSION}-linux-x64.tar.gz"
          archive_path="${RUNNER_TEMP:-/tmp}/$archive_name"
          sums_path="${RUNNER_TEMP:-/tmp}/SHASUMS256.txt"
          # The archive is verified on every run, not only when it is downloaded. A
          # persistent runner, or a preceding job that can write to the temporary
          # directory, could otherwise substitute the runtime that gets packaged.
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o "$sums_path"
          expected_sha256="$(awk -v name="$archive_name" '$2 == name { print $1 }' "$sums_path")"
          test -n "$expected_sha256"
          cached_sha256="$(sha256sum "$archive_path" 2>/dev/null | awk '{ print $1 }')"
          if [ ! -f "$archive_path" ] || [ "$cached_sha256" != "$expected_sha256" ]; then
            rm -f "$archive_path"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/$archive_name" -o "$archive_path"
            test "$(sha256sum "$archive_path" | awk '{ print $1 }')" = "$expected_sha256"
          fi
          # The extraction is rebuilt from the verified archive on every run. A
          # cached runtime is not trusted just because it reports the pinned
          # version: a preceding source-controlled step could have replaced it with
          # a trojan that prints any version, and this directory goes on PATH.
          rm -rf "$node_root"
          mkdir -p "$node_root"
          tar -xzf "$archive_path" -C "$node_root" --strip-components=1
          # Later steps must use the verified runtime rather than whatever the runner
          # provides, so the pinned directory goes on PATH for every following step.
          echo "$node_root/bin" >> "$GITHUB_PATH"
          export PATH="$node_root/bin:$PATH"
          test "$(command -v node)" = "$node_root/bin/node"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "10.9.8"

      - name: Checkout promotion tooling
        run: |
          set -eu
          for command_name in git curl; do
            command -v "$command_name" >/dev/null 2>&1 \
              || { printf 'missing runner command: %s\n' "$command_name" >&2; exit 1; }
          done
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF:-$GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD

      - name: Verify the candidate artifact
        # This step runs the tagged revision's verifier, so it holds no secret: the
        # write to the public release happens in the step after it.
        env:
          PROMOTE_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ""
        run: |
          set -eu
          API="https://api.github.com/repos/monty033/NookBridge"
          REL_TAG="${PROMOTE_REF#promote-}"
          VERSION="${REL_TAG#v}"
          ARTIFACT="nookbridge-v${VERSION}-linux-x64-gnu.tar.gz"
          RELEASE_JSON=/tmp/nookbridge-promote.json

          # The trigger is only a prefix match, so `promote-v` and `promote-vx/y`
          # both reach this job. The version must be well formed before it is
          # interpolated into API and download paths.
          case "$REL_TAG" in
            v[0-9A-Za-z]*) ;;
            *)
              printf 'malformed promotion ref: %s\n' "$PROMOTE_REF" >&2
              exit 1
              ;;
          esac
          # The version must satisfy the release policy. The rules live in one
          # script so that the workflow and the operator command cannot drift.
          bash scripts/check-release-version.sh "$VERSION" \
            || { printf 'malformed promotion version: %s\n' "$VERSION" >&2; exit 1; }

          # The commit this ref points at, captured before the canonical tag is
          # fetched and checked out below.
          promote_ref_commit="$(git rev-parse --verify 'HEAD^{commit}')"

          # The candidate release of a public repository is readable anonymously, so
          # this step needs no token even to read the release metadata.
          curl -fsS -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$REL_TAG" -o "$RELEASE_JSON"
          release_id="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('$RELEASE_JSON')); if (!value.id) process.exit(2); process.stdout.write(String(value.id));")"
          prerelease="$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync('$RELEASE_JSON')).prerelease));")"
          target_commit="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('$RELEASE_JSON')).target_commitish; if (!/^[0-9a-f]{40,64}$/.test(value || '')) process.exit(2); process.stdout.write(value);")"

          # Only a candidate may be promoted, and only once.
          test "$prerelease" = "true"

          # The promotion ref must point at the commit the canonical release tag
          # names. Without this, a hand-pushed promote-* ref at another commit
          # could clear the prerelease flag while this job verifies a revision
          # the candidate was never built from.
          git fetch --no-tags --depth=1 origin "refs/tags/$REL_TAG"
          canonical_tag_commit="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          test "$canonical_tag_commit" = "$target_commit"

          # The ref that triggered this job must itself name that commit, so a
          # hand-pushed promote-* ref at another revision cannot trigger a
          # promotion of a release it was never built for.
          test "$promote_ref_commit" = "$canonical_tag_commit"

          # Run the verification tooling from the tagged revision rather than
          # from the ref that triggered this job.
          git checkout -q --detach "$canonical_tag_commit"

          # Asset gate: promotion must require the complete published asset set,
          # not just the two files this job happens to download. An installer
          # asset that disappeared after the candidate run must fail the
          # promotion rather than reach the general install path. The set must be
          # exactly the expected one: an extra asset means the release was written
          # by something other than this workflow.
          node -e "
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync('$RELEASE_JSON'));
            const names = new Set((release.assets || []).map((asset) => String(asset.name)));
            const required = ['install.sh', 'install-systemd.sh', 'verify-linux-artifact.sh', 'SHA256SUMS', process.argv[1]];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) {
              console.error('missing GitHub release asset: ' + missing.join(', '));
              process.exit(2);
            }
            const extra = [...names].filter((name) => !required.includes(name));
            if (extra.length > 0) {
              console.error('unexpected GitHub release asset: ' + extra.join(', '));
              process.exit(2);
            }
          " "$ARTIFACT"

          work_dir="$PWD/.promote-work"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          for asset_name in "$ARTIFACT" SHA256SUMS; do
            curl -fsSL \
              "https://github.com/monty033/NookBridge/releases/download/$REL_TAG/$asset_name" \
              -o "$work_dir/$asset_name"
          done

          # Installer integrity: the published installers must be the reviewed
          # scripts from the tagged revision. The checksum file deliberately
          # covers only the artifact and the two auxiliary scripts, so install.sh
          # is compared byte-for-byte against its source here instead.
          for installer in install.sh install-systemd.sh verify-linux-artifact.sh; do
            case "$installer" in
              install.sh) installer_source='scripts/install-from-github.sh' ;;
              *) installer_source="scripts/$installer" ;;
            esac
            curl -fsSL \
              "https://github.com/monty033/NookBridge/releases/download/$REL_TAG/$installer" \
              -o "$work_dir/$installer"
            cmp -s "$work_dir/$installer" "$installer_source"
          done

          # Provenance gate: the artifact must record the release's own target
          # commit before it is allowed onto the general install path.
          bash scripts/verify-linux-artifact.sh \
            --artifact "$work_dir/$ARTIFACT" \
            --checksum-file "$work_dir/SHA256SUMS" \
            --expect-git-commit "$target_commit" \
            --expect-version "$VERSION"

          # The checks above run in a step that holds no secret. The write below runs in
          # its own step, and the values it needs cross the boundary as data in a
          # line-oriented file — not as a shell fragment to source. A preceding step
          # that the released revision can influence must not be able to hand the
          # token-bearing step code to execute.
          {
            printf 'rel_tag\t%s\n' "$REL_TAG"
            printf 'api_base\t%s\n' "$API"
            printf 'release_id\t%s\n' "$release_id"
            printf 'target_commit\t%s\n' "$target_commit"
            printf 'canonical_tag_commit\t%s\n' "$canonical_tag_commit"
            printf 'artifact\t%s\n' "$ARTIFACT"
            printf 'work_dir\t%s\n' "$work_dir"
          } > "$work_dir/context.tsv"

      - name: Promote candidate release
        # This step holds the publishing token. It resolves its tools from a fixed
        # PATH and reads fields out of a line-oriented file: it sources nothing,
        # executes no script from the released revision, and cannot be handed a
        # substituted `curl` or `awk` through a GITHUB_PATH entry an earlier step
        # wrote. Otherwise the token would go with the substitution.
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          # An explicit PATH replaces the runner's own, so directories an earlier
          # step added to GITHUB_PATH are not searched. The trusted prefixes cover
          # both a conventional Linux runner and a NixOS one.
          PATH: /run/current-system/sw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # The runner injects anything a previous step wrote to $GITHUB_ENV into this
          # step, and a non-interactive bash sources BASH_ENV before it runs the body.
          # A tagged step could otherwise leave a script here and have this shell read
          # the token. The values are set explicitly so the injected ones cannot win,
          # and the body re-checks them so that a runner which applies them anyway
          # fails this step instead of running it with an attacker's startup file.
          BASH_ENV: ""
          ENV: ""
          GITHUB_TOKEN: ""
        run: |
          set -eu
          test -n "${RELEASE_PUBLISH_TOKEN:-}"
          test -z "${BASH_ENV:-}" \
            || { printf 'refusing a BASH_ENV in the token-bearing step\n' >&2; exit 1; }
          test -z "${ENV:-}" \
            || { printf 'refusing an ENV in the token-bearing step\n' >&2; exit 1; }
          curl_path="$(command -v curl)"
          case "$curl_path" in
            /run/current-system/sw/bin/* | /usr/local/* | /usr/bin/* | /bin/* | /sbin/*) ;;
            *)
              printf 'refusing an untrusted curl: %s\n' "$curl_path" >&2
              exit 1
              ;;
          esac
          awk_path="$(command -v awk)"
          case "$awk_path" in
            /run/current-system/sw/bin/* | /usr/bin/* | /bin/*) ;;
            *)
              printf 'refusing an untrusted awk: %s\n' "$awk_path" >&2
              exit 1
              ;;
          esac
          context="$PWD/.promote-work/context.tsv"
          field() { "$awk_path" -F'\t' -v key="$1" '$1 == key { print $2; exit }' "$context"; }

          api_base="$(field api_base)"
          release_id="$(field release_id)"
          rel_tag="$(field rel_tag)"

          # The values are validated rather than trusted: a wrong one would send an
          # authenticated request somewhere unintended.
          test "$api_base" = "https://api.github.com"
          case "$release_id" in '' | *[!0-9]*) printf 'unusable release id\n' >&2; exit 1 ;; esac
          case "$rel_tag" in v[0-9]*) ;; *) printf 'unusable release tag\n' >&2; exit 1 ;; esac

          # The bearer token is passed through a curl configuration file rather than
          # an argument, because a command line is readable by any process on the
          # runner and this token grants release write access.
          curl_config="$(mktemp)"
          chmod 600 "$curl_config"
          printf 'header = "Authorization: Bearer %s"\n' "$RELEASE_PUBLISH_TOKEN" > "$curl_config"
          trap 'rm -f "$curl_config"' EXIT

          "$curl_path" -fsS -X PATCH --config "$curl_config" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary '{"prerelease":false}' \
            "$api_base/releases/$release_id" -o /dev/null

          printf 'prerelease flag cleared for %s\n' "$rel_tag"

      - name: Re-verify the promoted release
        # Back to a step that holds no secret: the post-flip re-verification runs the
        # tagged revision's verifier, so it must not have a token in its environment.
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eu
          context="$PWD/.promote-work/context.tsv"
          field() { awk -F'\t' -v key="$1" '$1 == key { print $2; exit }' "$context"; }
          rel_tag="$(field rel_tag)"
          target_commit="$(field target_commit)"
          canonical_tag_commit="$(field canonical_tag_commit)"
          artifact="$(field artifact)"
          work_dir="$(field work_dir)"

          # This step holds no secret, so it is the right place to read the promoted
          # state back and assert it: a successful PATCH is not proof, and the
          # assertions must not depend on the step that performed the write.
          state_json="$work_dir/promoted-state.json"
          curl -fsS -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/monty033/NookBridge/releases/tags/$rel_tag" \
            -o "$state_json"
          node -e "
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (release.prerelease !== false) {
              console.error('the release is still a prerelease after promotion');
              process.exit(2);
            }
            if (typeof release.draft !== 'boolean') {
              console.error('the promoted release payload does not report its draft state');
              process.exit(2);
            }
            if (release.draft === true) {
              console.error('the promoted release is a draft, so users cannot install from it');
              process.exit(2);
            }
            const target = String(release.target_commitish || '');
            if (target !== process.argv[2]) {
              console.error('the promoted release targets ' + target + ', not the promoted commit');
              process.exit(2);
            }
            const names = new Set((release.assets || []).map((asset) => String(asset.name)));
            const required = ['install.sh', 'install-systemd.sh', 'verify-linux-artifact.sh', 'SHA256SUMS', process.argv[3]];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) {
              console.error('missing GitHub release asset after promotion: ' + missing.join(', '));
              process.exit(2);
            }
            const extra = [...names].filter((name) => !required.includes(name));
            if (extra.length > 0) {
              console.error('unexpected GitHub release asset after promotion: ' + extra.join(', '));
              process.exit(2);
            }
          " "$state_json" "$canonical_tag_commit" "$artifact"

          # Re-verify the installer bytes after the flip as well: a concurrent release
          # writer can replace same-named assets between the checks above and the
          # PATCH, and the release API offers no transaction that would make this
          # unnecessary.
          after_dir="$work_dir/after"
          mkdir -p "$after_dir"
          for installer in install.sh install-systemd.sh verify-linux-artifact.sh; do
            case "$installer" in
              install.sh) installer_source='scripts/install-from-github.sh' ;;
              *) installer_source="scripts/$installer" ;;
            esac
            curl -fsSL \
              "https://github.com/monty033/NookBridge/releases/download/$rel_tag/$installer" \
              -o "$after_dir/$installer"
            cmp -s "$after_dir/$installer" "$installer_source"
          done

          # Re-verify the artifact and its checksum file too, for the same reason:
          # verifying only the installers after the flip leaves the artifact that
          # installers fetch unverified at the moment the release became public.
          # The downloads land in a subdirectory so that the checksum file's own
          # asset names still match the files they cover.
          for asset_name in "$artifact" SHA256SUMS; do
            curl -fsSL \
              "https://github.com/monty033/NookBridge/releases/download/$rel_tag/$asset_name" \
              -o "$after_dir/$asset_name"
          done
          bash scripts/verify-linux-artifact.sh \
            --artifact "$after_dir/$artifact" \
            --checksum-file "$after_dir/SHA256SUMS" \
            --expect-git-commit "$target_commit" \
            --expect-version "${rel_tag#v}"

          printf 'release promoted: %s\n' "$rel_tag"
