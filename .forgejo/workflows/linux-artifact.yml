name: Linux artifact

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux-artifact:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git gzip tar
          rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run build
          npm test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Prepare production dependencies
        run: npm prune --omit=dev

      - name: Build and verify x86_64 glibc artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${RELEASE_VERSION#v}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          GLIBC_BASELINE="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          LIBSTDCXX_BASELINE="$(strings "$(g++ -print-file-name=libstdc++.so.6)" | grep '^GLIBCXX_' | sort -V | tail -n 1)"
          npm run artifact:linux -- \
            --source-dir "$PWD" \
            --node-runtime "$(command -v node)" \
            --output-dir "$PWD/artifacts" \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --min-glibc "$GLIBC_BASELINE" \
            --min-libstdcxx "$LIBSTDCXX_BASELINE"
          npm run artifact:verify -- \
            --artifact "$PWD/artifacts/nookbridge-v${VERSION}-linux-x64-gnu.tar.gz" \
            --checksum-file "$PWD/artifacts/SHA256SUMS"

      - name: Upload verified artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nookbridge-linux-x64-gnu-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
